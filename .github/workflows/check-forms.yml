name: 様式の更新チェック

# 毎週月曜 9:17（日本時間）に高知県のページを確認し、様式が変わっていたら Issue を作る
on:
  schedule:
    - cron: "17 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: check
        run: node tools/check-forms.mjs
        continue-on-error: true
      - if: steps.check.outcome == 'failure' && steps.check.outputs.report != ''
        uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.check.outputs.report }}
        with:
          script: |
            const title = "高知県の様式が更新されました";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100,
            });
            const existing = open.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number,
                body: process.env.REPORT,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body: process.env.REPORT,
              });
            }
      - if: steps.check.outcome == 'failure' && steps.check.outputs.report == ''
        run: |
          echo "県のページを確認できませんでした（サイトの不調の可能性があります）"
          exit 1
